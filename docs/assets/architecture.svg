<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300">
  <!-- Illustration: architecture of the Mercedes-Benz integration for Gladys. -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="980" height="300" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="12" fill="#1f2328">
    <rect x="20" y="70" width="180" height="150" rx="12" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="1.5"/>
    <text x="110" y="105" font-weight="bold" font-size="15">Gladys Assistant</text>
    <text x="110" y="135" fill="#57606a">devices, states</text>
    <text x="110" y="155" fill="#57606a">scenes, dashboard</text>
    <text x="110" y="175" fill="#57606a">configuration</text>

    <path d="M201 120 H300" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="250" y="110" font-size="10" fill="#57606a">REST</text>
    <text x="250" y="140" font-size="10" fill="#57606a">/api/integration/v1</text>
    <path d="M201 175 H300" stroke="#57606a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="250" y="195" font-size="10" fill="#57606a">WebSocket</text>

    <rect x="301" y="50" width="250" height="190" rx="12" fill="#eef8f1" stroke="#2f8f5b" stroke-width="1.5"/>
    <text x="426" y="80" font-weight="bold" font-size="15">Integration container</text>
    <text x="426" y="105" fill="#57606a">SDK · src/app.js</text>
    <text x="426" y="130" fill="#57606a">auth.js: CIAM sign-in, tokens</text>
    <text x="426" y="150" fill="#57606a">socket.js: push sessions</text>
    <text x="426" y="170" fill="#57606a">proto.js: protobuf messages</text>
    <text x="426" y="190" fill="#57606a">rest.js: cars, capabilities</text>
    <text x="426" y="220" font-size="10" fill="#57606a">/data/session.json</text>

    <path d="M552 95 H660" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <text x="606" y="85" font-size="10" fill="#57606a">HTTPS</text>
    <path d="M552 145 H660" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
    <path d="M552 195 H660" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="606" y="215" font-size="10" fill="#57606a">wss, protobuf</text>

    <rect x="661" y="40" width="170" height="210" rx="12" fill="#fdf4e7" stroke="#b7791f" stroke-width="1.5"/>
    <text x="746" y="68" font-weight="bold" font-size="14">Mercedes me cloud</text>
    <text x="746" y="100" fill="#57606a">id.mercedes-benz.com</text>
    <text x="746" y="150" fill="#57606a">bff REST API</text>
    <text x="746" y="200" fill="#57606a">push websocket</text>

    <path d="M832 145 H880" stroke="#57606a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="881" y="105" width="85" height="80" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="923" y="140" font-weight="bold">Car</text>
    <text x="923" y="160" font-size="10" fill="#57606a">mobile data</text>

    <text x="490" y="285" font-size="11" fill="#57606a">Illustration — everything goes through the cloud (no local access to the car)</text>
  </g>
</svg>
